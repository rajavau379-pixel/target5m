    .send-btn {

    .send-btn i {

    .send-btn .ripple {
      position: absolute;

      animation: rippleAnim 0.8s linear;

    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }

    /* response */
    .response-box {
      margin-top: 22px;
      padding: 14px 20px;

    /* footer with channel icons */

<body>
  <!-- BG layers -->
  <div class="cosmic-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="stars" id="stars"></div>

  <!-- Main Card -->
  <div class="glass-card">
    <!-- Brand -->
    <div class="brand">
      <div class="logo">
        <i class="fas fa-crown"></i> KAMAL
      </div>
      <div class="tagline">👑 <span>SMS</span> · Unlimited · Free</div>
      <div class="divider-glow"></div>
    </div>

    <!-- Status -->
    <div class="status-pill">
      <span class="status-dot"></span>
      <span class="status-text"><i class="fas fa-bolt"></i> Online · Ready</span>
    </div>

    <!-- Phone -->
    <div class="field">
      <label><i class="fas fa-phone-alt"></i> Phone Number</label>
      <input type="text" id="phoneInput" placeholder="+92xxxxxxxxxx" value="+92xxxxxxxxxx" />
    </div>

    <!-- Quick count -->
    <div class="quick-grid">
      <button class="quick-btn" data-count="1">1</button>
      <button class="quick-btn" data-count="5">5</button>
      <button class="quick-btn active" data-count="10">10</button>
      <button class="quick-btn" data-count="25">25</button>
      <button class="quick-btn" data-count="50">50</button>
    </div>

    <!-- Count -->
    <div class="field">
      <label><i class="fas fa-hashtag"></i> SMS Count</label>
      <input type="number" id="countInput" value="10" min="1" max="50" />
    </div>

    <!-- Send -->
    <button class="send-btn" id="sendBtn">
      <i class="fas fa-paper-plane"></i> Send SMS
    </button>

    <!-- Response -->
    <div class="response-box" id="responseBox">
      <i class="fas fa-circle-info"></i>
      <span class="msg" id="responseMsg">Ready</span>
    </div>

    <!-- Footer with Telegram & WhatsApp channels -->
    <div class="footer-links">
      <a href="https://t.me/abdullah_king_0094" target="_blank" class="telegram">
        <i class="fab fa-telegram-plane"></i> Telegram
      </a>
      <a href="https://whatsapp.com/channel/0029Vb8etCUD38CS9rAwV81v" target="_blank" class="whatsapp">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </a>
    </div>
  </div>

  <script>
    // ——— CONFIG ———
    const API_URL = 'https://sms-bomber.elevatex.workers.dev/';
    const MAX_SMS = 50;
    const MIN_SMS = 1;

    // ——— DOM ———
    const phoneInput = document.getElementById('phoneInput');
    const countInput = document.getElementById('countInput');
    const sendBtn = document.getElementById('sendBtn');
    const responseBox = document.getElementById('responseBox');
    const responseMsg = document.getElementById('responseMsg');
    const quickBtns = document.querySelectorAll('.quick-btn');

    // ——— STARS ———
    (function createStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 60; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.animationDuration = (Math.random() * 14 + 10) + 's';
        star.style.animationDelay = (Math.random() * 15) + 's';
        star.style.width = (Math.random() * 3 + 1.5) + 'px';
        star.style.height = star.style.width;
        star.style.boxShadow = `0 0 ${Math.random() * 16 + 6}px #ffaa00`;
        container.appendChild(star);
      }
    })();

    // ——— RESPONSE ———
    function showResponse(msg, type = 'info') {
      responseBox.className = 'response-box show ' + type;
      responseMsg.textContent = msg;
      clearTimeout(responseBox._hideTimer);
      responseBox._hideTimer = setTimeout(() => {
        responseBox.classList.remove('show');
      }, 6500);
    }

    // ——— SEND ———
    async function sendSMS() {
      const phone = phoneInput.value.trim();
      if (!phone || !phone.match(/^\+?[0-9]{10,15}$/)) {
        showResponse('Invalid phone number. Use +923001234567', 'error');
        return;
      }

      let count = parseInt(countInput.value) || 1;
      count = Math.min(Math.max(count, MIN_SMS), MAX_SMS);
      countInput.value = count;

      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      showResponse('Sending ' + count + ' SMS to ' + phone + ' …', 'info');

      try {
        const url = API_URL + '?phone=' + encodeURIComponent(phone) + '&count=' + count;
        const res = await fetch(url);

        if (res.ok) {
          const data = await res.text();
          showResponse('✓ ' + count + ' SMS sent to ' + phone + '!', 'success');
        } else {
          showResponse('API error (HTTP ' + res.status + '). Try again.', 'error');
        }
      } catch (err) {
        showResponse('Network error: ' + err.message, 'error');
      }

      sendBtn.disabled = false;
      sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send SMS';
    }

    // ——— QUICK COUNT ———
    quickBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const val = parseInt(this.dataset.count);
        countInput.value = val;
        quickBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // ——— COUNT SYNC ———
    countInput.addEventListener('input', function() {
      let val = parseInt(this.value) || 1;
      val = Math.min(Math.max(val, MIN_SMS), MAX_SMS);
      this.value = val;
      quickBtns.forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.count) === val);
      });
    });
    countInput.addEventListener('blur', function() {
      let val = parseInt(this.value) || 1;
      val = Math.min(Math.max(val, MIN_SMS), MAX_SMS);
      this.value = val;
    });

    // ——— ENTER ———
    phoneInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendSMS(); });
    countInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendSMS(); });

    // ——— SEND CLICK + RIPPLE ———
    sendBtn.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      ripple.style.width = ripple.style.height = '70px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);
      sendSMS();
    });

    // ——— INIT ———
    showResponse('🟢 System ready · enter number', 'success');
    console.log('👑 KAMAL · Premium SMS Bomber');
  </script>
</body>
